<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff8bb0">
<title>ねこちゃんを ゴールまで つれていこう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#6a4457;
  --paper:#fffdfe;
  --cream:#fff3f8;
  --rule:#f6b9d0;
  --pink:#ff8bb0;
  --pink-d:#f06f9a;
  --pinkbg:#ffe3ee;
  --peach:#ffcaa6; --peachbg:#ffe8d8; --peach-d:#f0a878;
  --mint:#8fd8c3; --mintbg:#dcf4ec; --mint-d:#5fc3a8;
  --lav:#cbb7e6; --lavbg:#eee6f8; --lav-d:#a98bd4;
  --sun:#ffcf4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",YuGothic,"Meiryo",sans-serif;
  font-weight:500;color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #fff 0 8px, transparent 9px) 0 0/46px 46px,
    var(--cream);
  min-height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:12px 12px 28px;gap:12px;
}
h1{font-family:"Mochiy Pop One",sans-serif;font-weight:400;color:var(--pink);
  font-size:clamp(18px,5vw,26px);margin:2px 0 0;text-align:center;letter-spacing:.02em}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px}

/* ---- ヘッダ ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.levelpick{display:flex;gap:6px;flex-wrap:wrap}
.lv{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--rule);background:#fff;
  font-family:"Mochiy Pop One",sans-serif;font-size:13px;color:var(--pink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.lv.on{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 2px 0 var(--pink-d)}
.lv:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--rule);background:#fff;
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.icon-btn:focus-visible{outline:3px solid var(--lav);outline-offset:2px}

/* ---- もんだいカード見出し ---- */
.title-card{background:#fff;border:3px solid var(--rule);border-radius:16px;padding:8px 14px;
  display:flex;align-items:center;gap:10px}
.badge{background:var(--pink);color:#fff;width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  font-family:"Mochiy Pop One",sans-serif;font-size:16px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 3px 0 var(--pink-d)}
.title-card .t{font-family:"Mochiy Pop One",sans-serif;font-size:16px;color:var(--ink)}
.title-card .h{font-size:11px;color:#a5789a;margin-top:1px}

/* ---- ばん ---- */
.board-wrap{background:#fff;border:4px solid var(--pink);border-radius:18px;padding:8px;
  box-shadow:0 6px 0 #ffd0e0;}
.board{position:relative;width:100%;aspect-ratio:var(--c)/var(--r);
  display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr);}
.cell{border:1.5px solid #ffe0ec;position:relative;display:flex;align-items:center;justify-content:center}
.cell.wall{background:var(--lav);border-color:var(--lav-d);border-radius:6px}
.cell.wall::after{content:"";position:absolute;inset:22%;border-radius:4px;
  background:repeating-linear-gradient(45deg,#fff5,#fff5 3px,transparent 3px,transparent 7px)}
.cell.goal::before{content:"";position:absolute;width:64%;height:64%;background:var(--sun);
  filter:drop-shadow(0 1px 0 #f0a800);
  clip-path:polygon(50% 2%,63% 35%,98% 36%,70% 58%,80% 94%,50% 72%,20% 94%,30% 58%,2% 36%,37% 35%);
  animation:twinkle 1.6s ease-in-out infinite}
.gem{position:absolute;width:38%;height:38%;background:var(--pink);transform:rotate(-45deg);
  animation:beat 1s ease-in-out infinite}
.gem::before,.gem::after{content:"";position:absolute;width:100%;height:100%;background:var(--pink);border-radius:50%}
.gem::before{top:-50%;left:0}.gem::after{right:-50%;top:0}
.gem.got{opacity:0;transform:rotate(-45deg) scale(0);transition:.4s}

/* ---- ねこちゃん ---- */
.cat{position:absolute;left:calc((var(--cc) - .5)/var(--c)*100%);
  top:calc((var(--cr) - .5)/var(--r)*100%);width:calc(100%/var(--c));height:calc(100%/var(--r));
  transform:translate(-50%,-50%);transition:left .32s cubic-bezier(.34,1.5,.5,1),top .32s cubic-bezier(.34,1.5,.5,1);
  display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.face{width:66%;height:66%;background:#ffb0cb;border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;gap:20%;animation:bob 2s ease-in-out infinite}
.face::before,.face::after{content:"";position:absolute;top:-16%;width:30%;height:34%;
  background:#ffb0cb;border-radius:52% 52% 12% 12%}
.face::before{left:2%;transform:rotate(-16deg)}
.face::after{right:2%;transform:rotate(16deg)}
.face i{width:12%;height:15%;background:#6a4457;border-radius:50%;z-index:2}
.face .ck{position:absolute;width:15%;height:11%;background:#ff6f9c;border-radius:50%;top:54%;z-index:1;opacity:.8}
.face .ck.l{left:13%}.face .ck.r{right:13%}
.face .mo{position:absolute;width:15%;height:8%;border:1.6px solid #6a4457;border-top:none;
  border-radius:0 0 80% 80%;top:56%;z-index:2}
.face.bump{animation:bump .4s}
.face.cheer{animation:cheer .5s}

/* ---- コマンドれっしゃ ---- */
.railbox{background:#fff;border:3px dashed var(--rule);border-radius:16px;padding:8px 10px;min-height:64px;
  display:flex;align-items:center;gap:6px;overflow-x:auto}
.rail-empty{color:#d99ab8;font-size:12px;padding:6px 2px}
.chip{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--ink);border:2.5px solid;animation:pop .25s}
.chip.up{background:var(--mintbg);border-color:var(--mint)}
.chip.down{background:var(--lavbg);border-color:var(--lav)}
.chip.left{background:var(--peachbg);border-color:var(--peach-d)}
.chip.right{background:var(--pinkbg);border-color:var(--pink)}
.chip.doing{transform:scale(1.15);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--sun)}
.grp{flex:0 0 auto;display:flex;gap:3px;padding:2px;border-radius:14px}
.grp.doing{background:#fff6da;box-shadow:0 0 0 3px var(--sun)}
.chip.num{background:#fff6da;border-color:var(--sun);flex-direction:column;gap:0;line-height:1}
.chip.num b{font-family:"Mochiy Pop One",sans-serif;font-size:18px;color:#c98b00}
.chip.num small{font-size:9px;color:#c98b00}

/* ---- かずカード（くりかえし）---- */
.numrow{display:none;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.numrow.on{display:flex}
.numlbl{font-size:12px;color:#c98b00;font-weight:900}
.numbtn{width:42px;height:42px;border-radius:12px;border:3px solid var(--sun);background:#fff6da;
  font-family:"Mochiy Pop One",sans-serif;font-size:17px;color:#c98b00;cursor:pointer;
  box-shadow:0 4px 0 #f0c14b;padding:0}
.numbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #f0c14b}
.numbtn:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.numbtn[disabled]{opacity:.4;cursor:default}
.counter{font-size:11px;font-weight:900;color:var(--pink-d);background:var(--pinkbg);
  border-radius:99px;padding:4px 9px;white-space:nowrap;display:none}

/* ---- ほうこうボタン ---- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;
  max-width:280px;margin:0 auto;width:100%}
.dir{aspect-ratio:1;border-radius:18px;border:3px solid;background:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:"Zen Maru Gothic",sans-serif;font-weight:900;color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .06s}
.dir .ar{font-size:30px;line-height:1}
.dir .lb{font-size:13px}
.dir:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.dir:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.dir[disabled]{opacity:.4;cursor:default}
.dir.up{grid-column:2;grid-row:1;background:var(--mintbg);border-color:var(--mint)}
.dir.left{grid-column:1;grid-row:2;background:var(--peachbg);border-color:var(--peach-d)}
.dir.down{grid-column:2;grid-row:2;background:var(--lavbg);border-color:var(--lav)}
.dir.right{grid-column:3;grid-row:2;background:var(--pinkbg);border-color:var(--pink)}

/* ---- そうさボタン ---- */
.controls{display:flex;gap:8px}
.btn{flex:1;border:none;border-radius:16px;padding:14px 8px;cursor:pointer;
  font-family:"Mochiy Pop One",sans-serif;font-size:16px;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--pink);box-shadow:0 4px 0 var(--pink-d)}
.btn.small{flex:0 0 auto;background:#fff;color:var(--pink);border:2.5px solid var(--rule);
  box-shadow:none;font-size:14px;padding:14px 14px}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}

.talk{min-height:22px;text-align:center;font-size:13px;color:var(--pink-d);font-weight:700}

/* ---- クリア えんしゅつ ---- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(255,180,205,.35);backdrop-filter:blur(2px);z-index:50}
.overlay.on{display:flex}
.clear-card{background:#fff;border:4px solid var(--pink);border-radius:24px;padding:26px 30px;text-align:center;
  box-shadow:0 10px 0 #ffd0e0;animation:pop .4s;max-width:82vw}
.clear-card h2{font-family:"Mochiy Pop One",sans-serif;color:var(--pink);font-size:26px;margin:6px 0 4px}
.clear-card p{color:var(--ink);font-size:14px;margin:0 0 16px}
.clear-card .btn{width:100%}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:49}
.heart{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes beat{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.15)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bump{0%,100%{transform:translateX(0)}25%{transform:translateX(-14%)}75%{transform:translateX(14%)}}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-22%) scale(1.1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:left .12s linear,top .12s linear!important}
}
footer{font-size:11px;color:#c99;margin-top:2px;text-align:center}
</style>
</head>
<body>
<h1>ねこちゃんを ゴールまで つれていこう</h1>

<div class="wrap">
  <div class="topbar">
    <div class="levelpick" id="levelpick"></div>
    <button class="icon-btn" id="sound" aria-label="おと">🔊</button>
  </div>

  <div class="title-card">
    <div class="badge" id="badge">1</div>
    <div style="flex:1">
      <div class="t" id="ttl">まっすぐ すすもう</div>
      <div class="h" id="hint">みぎ に すすむだけ</div>
    </div>
    <div class="counter" id="counter"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="talk" id="talk">カードを えらんで 「じっこう」を おしてね</div>

  <div class="railbox" id="rail"><span class="rail-empty">ここに カードが ならぶよ</span></div>

  <div class="pad" id="pad">
    <button class="dir up"    data-dir="up"><span class="ar">▲</span><span class="lb">まえ</span></button>
    <button class="dir left"  data-dir="left"><span class="ar">◀</span><span class="lb">ひだり</span></button>
    <button class="dir down"  data-dir="down"><span class="ar">▼</span><span class="lb">うしろ</span></button>
    <button class="dir right" data-dir="right"><span class="ar">▶</span><span class="lb">みぎ</span></button>
  </div>

  <div class="numrow" id="numrow">
    <span class="numlbl">くりかえし</span>
    <button class="numbtn" data-n="2">2</button>
    <button class="numbtn" data-n="3">3</button>
    <button class="numbtn" data-n="4">4</button>
    <button class="numbtn" data-n="5">5</button>
    <button class="numbtn" data-n="6">6</button>
  </div>

  <div class="controls">
    <button class="btn small" id="undo" aria-label="1つ もどす">↩︎</button>
    <button class="btn small" id="clear" aria-label="ぜんぶ けす">🗑</button>
    <button class="btn go" id="run">▶ じっこう</button>
    <button class="btn small" id="reset" aria-label="さいしょから">⟲</button>
  </div>

  <footer>やじるしを タップ → 「じっこう」で ねこちゃんが うごくよ</footer>
</div>

<div class="confetti" id="confetti"></div>
<div class="overlay" id="overlay">
  <div class="clear-card">
    <div style="font-size:40px">🎉</div>
    <h2>クリア！</h2>
    <p id="clear-msg">よく できました！</p>
    <button class="btn go" id="next">つぎの もんだいへ ▶</button>
  </div>
</div>

<script>
"use strict";

/* ====== もんだいデータ（row 1 = いちばん うえ）====== */
const LEVELS = [
  {no:1, title:"まっすぐ すすもう", hint:"みぎ に すすむだけ",
   c:5, r:5, start:[1,3], goal:[4,3], walls:[], gem:null},
  {no:2, title:"うえに すすもう", hint:"まえ は うえ だよ",
   c:5, r:5, start:[3,5], goal:[3,2], walls:[], gem:null},
  {no:3, title:"まがってみよう", hint:"みぎ と まえ を くみあわせよう",
   c:5, r:5, start:[1,5], goal:[3,3], walls:[], gem:null},
  {no:4, title:"かべを よけよう", hint:"むらさきの かべは とおれない",
   c:5, r:5, start:[1,5], goal:[5,5], walls:[[3,5],[3,4]], gem:null},
  {no:5, title:"ハートを ひろって", hint:"さきに ♡ を とってから ゴール",
   c:5, r:5, start:[3,5], goal:[5,3], walls:[], gem:[1,3]},
  {no:6, title:"L の みちを いこう", hint:"みぎ に いって うえ に いこう",
   c:5, r:5, start:[1,5], goal:[4,2], walls:[], gem:null},
  {no:7, title:"ながい いっぽんみち", hint:"みぎ を なんかい おすかな？",
   c:5, r:5, start:[1,5], goal:[5,5], walls:[], gem:null},
  {no:8, title:"かどを まがって ゴール", hint:"みぎ に いって、まえ で うえへ",
   c:5, r:5, start:[1,5], goal:[5,1], walls:[], gem:null},

  /* ---- ここから くりかえしカード ---- */
  {no:9, title:"ながい みちを みじかく", hint:"みぎ の あとに かずカードを おこう",
   c:7, r:5, start:[1,3], goal:[7,3], walls:[], gem:null, rep:true, max:2},
  {no:10, title:"L の みちを みじかく", hint:"みぎ と まえ、2つの かたまりで いけるよ",
   c:6, r:6, start:[1,6], goal:[6,1], walls:[], gem:null, rep:true, max:4},
  {no:11, title:"かべを こえて いこう", hint:"うえ に あがってから よこに すすもう",
   c:6, r:6, start:[1,6], goal:[6,6], walls:[[4,6],[4,5]], gem:null, rep:true, max:6},
  {no:12, title:"ハートを とって ゴール", hint:"さきに ♡ を とってから ゴールへ",
   c:6, r:6, start:[1,6], goal:[6,1], walls:[], gem:[1,1], rep:true, max:4},
];

const DIRS = {
  up:   {dx:0,  dy:-1, arrow:"▲"},
  down: {dx:0,  dy:1,  arrow:"▼"},
  left: {dx:-1, dy:0,  arrow:"◀"},
  right:{dx:1,  dy:0,  arrow:"▶"},
};

/* ====== じょうたい ====== */
let li = 0;          // レベル番号(index)
let lvl, cat, queue, gotGem, running, muted=false;

const $ = s => document.querySelector(s);
const board=$("#board"), rail=$("#rail"), talk=$("#talk"),
      overlay=$("#overlay"), confetti=$("#confetti");

/* ====== おと（Web Audio）====== */
let actx=null;
function tone(freq,dur,type="sine",vol=.14){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.value=vol; o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sStep=()=>tone(660,.12,"triangle");
const sPick=()=>tone(880,.08,"sine",.1);
const sBump=()=>tone(150,.2,"sawtooth",.12);
function sWin(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,"sine",.16),i*120)); }

/* ====== レベル よみこみ ====== */
function loadLevel(i){
  li = (i+LEVELS.length)%LEVELS.length;
  lvl = LEVELS[li];
  cat = {x:lvl.start[0], y:lvl.start[1]};
  queue = []; gotGem=false; running=false;
  $("#badge").textContent = lvl.no;
  $("#ttl").textContent = lvl.title;
  $("#hint").textContent = lvl.hint;
  $("#numrow").classList.toggle("on", !!lvl.rep);
  buildBoard();
  renderQueue();
  setTalk("カードを えらんで 「じっこう」を おしてね");
  overlay.classList.remove("on");
  document.querySelectorAll(".lv").forEach((b,idx)=>b.classList.toggle("on",idx===li));
  setControls(false);
}

function buildBoard(){
  board.style.setProperty("--c", lvl.c);
  board.style.setProperty("--r", lvl.r);
  board.innerHTML="";
  const wallSet = new Set(lvl.walls.map(w=>w[0]+","+w[1]));
  for(let y=1;y<=lvl.r;y++){
    for(let x=1;x<=lvl.c;x++){
      const d=document.createElement("div");
      d.className="cell";
      if(wallSet.has(x+","+y)) d.classList.add("wall");
      if(lvl.goal[0]===x && lvl.goal[1]===y) d.classList.add("goal");
      if(lvl.gem && lvl.gem[0]===x && lvl.gem[1]===y){
        const g=document.createElement("div"); g.className="gem"; g.id="gem"; d.appendChild(g);
      }
      board.appendChild(d);
    }
  }
  const c=document.createElement("div");
  c.className="cat"; c.id="cat";
  c.innerHTML='<div class="face" id="face"><i></i><i></i><span class="ck l"></span><span class="ck r"></span><span class="mo"></span></div>';
  board.appendChild(c);
  placeCat(false);
}

function placeCat(){
  const el=$("#cat");
  el.style.setProperty("--cc", cat.x);
  el.style.setProperty("--cr", cat.y);
}

/* ====== キュー ======
   1つの ようそ = {d:ほうこう, n:かいすう}
   n>1 の ときは 「くりかえしカード」が ついている あつかい
    */
function cardCount(){ return queue.reduce((s,q)=> s + (q.n>1 ? 2 : 1), 0); }

function updateCounter(){
  const el=$("#counter");
  if(lvl.max){ el.style.display="block"; el.textContent="カード "+cardCount()+" / "+lvl.max; }
  else el.style.display="none";
}

function renderQueue(){
  updateCounter();
  if(queue.length===0){ rail.innerHTML='<span class="rail-empty">ここに カードが ならぶよ</span>'; return; }
  rail.innerHTML="";
  queue.forEach((q,i)=>{
    const g=document.createElement("div");
    g.className="grp"; g.dataset.i=i;
    const c=document.createElement("div");
    c.className="chip "+q.d; c.textContent=DIRS[q.d].arrow;
    g.appendChild(c);
    if(q.n>1){
      const nc=document.createElement("div");
      nc.className="chip num"; nc.innerHTML='<b>'+q.n+'</b><small>かい</small>';
      g.appendChild(nc);
    }
    rail.appendChild(g);
  });
  rail.scrollLeft = rail.scrollWidth;
}

function addCmd(dir){
  if(running) return;
  if(lvl.max && cardCount()+1 > lvl.max){
    setTalk("カードは "+lvl.max+"まいまで！ くりかえしカードを つかおう"); return;
  }
  if(!lvl.max && cardCount()>=16){ setTalk("カードは 16まいまでだよ"); return; }
  queue.push({d:dir, n:1}); sPick(); renderQueue(); setTalk("");
}

function addRep(n){
  if(running) return;
  if(queue.length===0){ setTalk("さきに やじるしを えらんでね"); return; }
  const last=queue[queue.length-1];
  if(last.n===1 && lvl.max && cardCount()+1 > lvl.max){
    setTalk("カードは "+lvl.max+"まいまでだよ"); return;
  }
  last.n=n; sPick(); renderQueue();
  setTalk(DIRS[last.d].arrow+" に "+n+"マス すすむよ");
}

function undo(){
  if(running) return;
  if(queue.length===0) return;
  const last=queue[queue.length-1];
  if(last.n>1) last.n=1; else queue.pop();
  // くりかえしカードから はずす
  renderQueue();
}
function clearQueue(){
  if(running) return;
  queue=[]; renderQueue(); backToStart();
  setTalk("ぜんぶ けして さいしょに もどったよ");
}

/* ====== じっこう ====== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function isWall(x,y){ return lvl.walls.some(w=>w[0]===x&&w[1]===y); }
function inBoard(x,y){ return x>=1&&x<=lvl.c&&y>=1&&y<=lvl.r; }

async function run(){
  if(running || queue.length===0){ if(queue.length===0) setTalk("さきに カードを えらんでね"); return; }
  running=true; setControls(true);
  cat={x:lvl.start[0], y:lvl.start[1]}; gotGem=false;
  const gemEl=$("#gem"); if(gemEl) gemEl.classList.remove("got");
  placeCat();
  await sleep(300);

  const grps=[...rail.children];
  for(let i=0;i<queue.length;i++){
    grps.forEach(g=>g.classList.remove("doing"));
    if(grps[i]) grps[i].classList.add("doing");
    const item=queue[i];
    const {dx,dy}=DIRS[item.d];

    for(let k=0;k<item.n;k++){
      const nx=cat.x+dx, ny=cat.y+dy;
      if(!inBoard(nx,ny) || isWall(nx,ny)){
        const f=$("#face"); f.classList.add("bump"); sBump();
        await sleep(400); f.classList.remove("bump");
        break;                       // かべに ぶつかったら この かたまりは おわり
      }
      cat.x=nx; cat.y=ny; placeCat(); sStep();
      await sleep(340);
      // ハート
      if(lvl.gem && cat.x===lvl.gem[0] && cat.y===lvl.gem[1] && !gotGem){
        gotGem=true; const g=$("#gem"); if(g) g.classList.add("got");
        tone(1046,.15,"sine",.16); setTalk("♡ を ゲット！");
      }
      // ゴール
      if(cat.x===lvl.goal[0] && cat.y===lvl.goal[1]){
        if(lvl.gem && !gotGem){ setTalk("さきに ♡ を とってね！"); }
        else { grps.forEach(g=>g.classList.remove("doing")); return win(); }
      }
    }
  }
  grps.forEach(g=>g.classList.remove("doing"));
  // おわっても ゴールで ない → スタートに もどる
  if(lvl.gem && !gotGem) setTalk("♡ を とってから ゴールしよう！");
  else setTalk("あとちょっと！ スタートに もどるよ");
  await sleep(700);
  backToStart();
  await sleep(400);
  running=false; setControls(false);
  setTalk("カードを なおして もういちど やってみよう");
}

function win(){
  const f=$("#face"); f.classList.add("cheer"); setTimeout(()=>f.classList.remove("cheer"),500);
  sWin(); rainHearts();
  const msgs=["よく できました！","てんさい！","だいせいかい！","すごい！ぴったり！"];
  $("#clear-msg").textContent = msgs[Math.floor(Math.random()*msgs.length)];
  $("#next").textContent = (li===LEVELS.length-1) ? "もういちど あそぶ ▶" : "つぎの もんだいへ ▶";
  setTimeout(()=>overlay.classList.add("on"),450);
  running=false;
}

function backToStart(){
  cat={x:lvl.start[0], y:lvl.start[1]}; gotGem=false;
  const g=$("#gem"); if(g) g.classList.remove("got");
  placeCat();
}

function reset(){
  if(running) return;
  backToStart(); setTalk("さいしょに もどったよ");
}

function setControls(lock){
  document.querySelectorAll(".dir").forEach(b=>b.disabled=lock);
  document.querySelectorAll(".numbtn").forEach(b=>b.disabled=lock);
  $("#run").disabled=lock; $("#undo").disabled=lock;
  $("#clear").disabled=lock; $("#reset").disabled=lock;
}
function setTalk(t){ talk.textContent=t; }

/* ====== クリア えんしゅつ（ハートの あめ）====== */
function rainHearts(){
  const marks=["💖","💕","⭐","🌸","💗"];
  for(let i=0;i<26;i++){
    const h=document.createElement("div");
    h.className="heart"; h.textContent=marks[i%marks.length];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(16+Math.random()*18)+"px";
    h.style.animationDuration=(1.8+Math.random()*1.6)+"s";
    h.style.animationDelay=(Math.random()*.5)+"s";
    confetti.appendChild(h);
    setTimeout(()=>h.remove(),3600);
  }
}

/* ====== レベルピッカー ====== */
const lp=$("#levelpick");
LEVELS.forEach((L,i)=>{
  const b=document.createElement("button");
  b.className="lv"; b.textContent=L.no; b.setAttribute("aria-label","もんだい"+L.no);
  b.addEventListener("click",()=>loadLevel(i));
  lp.appendChild(b);
});

/* ====== イベント ====== */
document.querySelectorAll(".dir").forEach(b=>b.addEventListener("click",()=>addCmd(b.dataset.dir)));
document.querySelectorAll(".numbtn").forEach(b=>b.addEventListener("click",()=>addRep(+b.dataset.n)));
$("#run").addEventListener("click",run);
$("#undo").addEventListener("click",undo);
$("#clear").addEventListener("click",clearQueue);
$("#reset").addEventListener("click",reset);
$("#next").addEventListener("click",()=> li===LEVELS.length-1 ? loadLevel(0) : loadLevel(li+1));
$("#sound").addEventListener("click",()=>{
  muted=!muted; $("#sound").textContent=muted?"🔈":"🔊";
  if(!muted) sPick();
});

// キーボード（おうちの ひと むけ）
document.addEventListener("keydown",e=>{
  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
  if(map[e.key]){ e.preventDefault(); addCmd(map[e.key]); }
  else if(e.key==="Enter"){ e.preventDefault(); run(); }
  else if(e.key==="Backspace"){ e.preventDefault(); undo(); }
  else if(/^[2-6]$/.test(e.key) && lvl.rep){ e.preventDefault(); addRep(+e.key); }
});

loadLevel(0);
</script>
</body>
</html>
